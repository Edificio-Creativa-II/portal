<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <title>Portal En Construcción</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #f8f9fa; /* Un gris claro más suave */
            font-family: system-ui, -apple-system, sans-serif; 
            -webkit-overflow-scrolling: touch; 
        }
        .container { 
            text-align: center; 
            padding: 24px; 
            max-width: 450px; /* Evita que la tarjeta sea gigante en PC */
            width: 100%;
        }
        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eef0f2;
        }
        img { 
            max-width: 100%; /* Ajuste perfecto al ancho de pantalla del móvil */
            height: auto; 
            display: block; 
            margin: 0 auto; 
        }
        p { 
            color: #4a5568; 
            margin-top: 24px; 
            font-size: 1.15em; 
            font-weight: 500;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="construccion.png" alt="Portal en construcción">
            <p>🏗️ Próximamente disponible para todos los copropietarios.</p>
        </div>
    </div>
</body>
</html>
